// Exports (to window): useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider,
//   TweakToggle, TweakRadio, TweakSelect, TweakText, TweakNumber, TweakColor, TweakButton.
//
// Owns the host protocol (listens for miaoda:tweaks:activate / miaoda:tweaks:deactivate,
// posts miaoda:tweaks:available / miaoda:tweaks:set-keys / miaoda:tweaks:dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#D97757",
//     "palette": ["#D97757", "#29261b", "#f6f4ef"],
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
//   TWEAK_DEFAULTS must live inline in the HTML file — in a <script type="text/babel"> block,
//   not in a separate .jsx/.js loaded via <script src>. That in-HTML block is the region the
//   host rewrites when the user adjusts a tweak, so keep it wrapped in the /*EDITMODE-BEGIN*/ …
//   /*EDITMODE-END*/ markers and the object between them valid JSON — double-quoted keys, no
//   trailing commas, no comments or expressions — even after you rename the keys. Move it out
//   of the HTML, strip the markers, or use a non-JSON body and tweak edits silently stop persisting.
//
//   function App() {
//     const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
//     return (
//       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>
//         Hello
//         <TweaksPanel>
//           <TweakSection label="Typography" />
//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        options={['#D97757', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakColor  label="Palette" value={t.palette}
//                        options={[['#D97757', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}
//                        onChange={(v) => setTweak('palette', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />
//         </TweaksPanel>
//       </div>
//     );
//   }
//
// TweakRadio is the segmented control for 2–3 short options (auto-falls-back to
// TweakSelect past ~16/~10 chars per label); reach for TweakSelect directly when
// options are many or long. For color tweaks always curate 3-4 options rather than
// a free picker; an option can also be a whole 2–5 color palette (the stored value
// is the array). The Tweak* controls are a floor, not a ceiling — build custom
// controls inside the panel if a tweak calls for UI they don't cover.
/* END USAGE */

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (miaoda:tweaks:set-keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*'); } catch (e) { /* no parent — ignore */ }
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts miaoda:tweaks:dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes miaoda:tweaks:deactivate back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // x = distance from the viewport's right edge, y = distance from its TOP.
  // The panel anchors top-right (right/top in CSS) so it clears the host's
  // bottom toolbar; both axes still grow inward, so clamp/drag math is
  // symmetric with the old bottom-right anchor.
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*'); } catch (e) { /* no parent — ignore */ }
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*'); } catch (e) { /* no parent — ignore */ }
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-miaoda-chrome=""
           style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~244px (280 panel − 32 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 12px system-ui averages ~6.6px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />

    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];

          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>

            </button>
          );
        })}
      </div>

  );
}

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts miaoda:tweaks:chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <ClaudeSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [items.join('\n')]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

<script type="text/babel">
/* ============ 通用 UI 原子组件 ============ */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

function Btn({ children, onClick, variant = "primary", disabled, className = "" }) {
  return (
    <button
      className={"btn btn-" + variant + " " + className}
      onClick={onClick}
      disabled={!!disabled}
      type="button"
    >
      {children}
    </button>
  );
}

function Chip({ children, tone, active, onClick, className = "" }) {
  const cls = "chip" + (tone ? " chip-" + tone : "") + (onClick ? " chip-btn" : "") + (active ? " chip-active" : "") + " " + className;
  return (
    <span className={cls} onClick={onClick}>{children}</span>
  );
}

function StatusIcon({ status }) {
  if (status === "ok") {
    return (
      <svg viewBox="0 0 24 24" className="si si-ok" aria-hidden="true">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.5-1.5 2.5 2.5 5.4-5.4 1.5 1.5z"></path>
      </svg>
    );
  }
  if (status === "warn") {
    return (
      <svg viewBox="0 0 24 24" className="si si-warn" aria-hidden="true">
        <path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"></path>
      </svg>
    );
  }
  return (
    <svg viewBox="0 0 24 24" className="si si-bad" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.5 12.7-1.4 1.4L12 14l-2.1 2.1-1.4-1.4L10.6 12 8.5 9.9l1.4-1.4L12 10.6l2.1-2.1 1.4 1.4L13.4 12l2.1 2.1z"></path>
    </svg>
  );
}

function Panel({ title, tag, children, className = "" }) {
  return (
    <section className={"panel " + className}>
      {(title || tag) && (
        <div className="panel-head">
          <div className="panel-title">{title}</div>
          {tag && <div className="panel-tag">{tag}</div>}
        </div>
      )}
      {children}
    </section>
  );
}

function MeterRow({ label, value, tone = "acc", suffix = "/100" }) {
  const [go, setGo] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setGo(true), 60);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="meter">
      <div className="meter-top">
        <span>{label}</span>
        <span className="meter-val">{value}<span style={{ color: "var(--mut)", fontSize: 11 }}> {suffix}</span></span>
      </div>
      <div className="meter-bar">
        <div className={"meter-fill tone-" + tone} style={{ width: go ? value + "%" : "0%" }}></div>
      </div>
    </div>
  );
}

function CountUp({ value, duration = 1100, className = "" }) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / duration);
      const e = 1 - Math.pow(1 - k, 3);
      setV(Math.round(value * e));
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return <span className={className}>{v}</span>;
}

function PhaseBar({ current, onJump }) {
  const phases = ["笔记浏览", "图片核验", "文案核验", "综合评分", "适配测试"];

          onClick={() => onJump && onJump(i)}
          title={onJump ? "点击跳转到该步骤" : undefined}
        >
          <span className="ph-num">{String(i + 1).padStart(2, "0")}</span>
          <span className="ph-name">{ph}</span>
        </div>
      ))}
    </nav>
  );
}

window.UI = { Btn, Chip, StatusIcon, Panel, MeterRow, CountUp, PhaseBar };

</script>
<script type="text/babel">
/* ============ VerifyCard：核验结果卡片（React + Tailwind + Framer Motion） ============
 * Props（mock 数据接口）：
 *   - title:       string            卡片标题（核验对象）
 *   - status:      "pass" | "suspicious"  核验状态，决定 badge 与光晕颜色
 *   - confidence:  number (0-100)    置信度
 *   - evidence:    string[]          证据条目
 *   - index:       number            入场 stagger 序号（60ms/项）
 *   - compact:     bool              紧凑模式（列表场景）
 */
const { useState, useRef } = React;
const M = window.Motion;
/* CDN 加载失败的降级：剥离动画 props 的纯 div */
const mDiv = M
  ? M.motion.div
  : function (props) {
      const rest = Object.assign({}, props);
      ["initial", "animate", "transition", "whileHover", "variants"].forEach((k) => delete rest[k]);
      return React.createElement("div", rest);
    };

function VerifyCard({ title, status = "suspicious", confidence = 0, evidence = [], index = 0, compact = false }) {
  const [hover, setHover] = useState(false);
  const innerRef = useRef(null);

  const isPass = status === "pass";
  const glowColor = isPass ? "rgba(0,71,253,0.35)" : "rgba(243,17,180,0.3)";
  const glowRadius = isPass ? 300 : 250;

  /* 光标跟随：写入 CSS 变量，避免逐帧重渲染 */
  const onMove = (e) => {
    const el = innerRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", (e.clientX - r.left) + "px");
    el.style.setProperty("--my", (e.clientY - r.top) + "px");
  };

  const badgeCls = isPass
    ? "bg-[rgba(0,71,253,0.25)] text-[#A8C0FF] border-[rgba(0,71,253,0.6)]"
    : "bg-[rgba(243,17,180,0.25)] text-[#FF9DCE] border-[rgba(243,17,180,0.6)]";
  const barCls = isPass
    ? "bg-gradient-to-r from-[#0047FD] to-[#6E9BFF]"
    : "bg-gradient-to-r from-[#5A1FD0] to-[#F31199]";
  const numColor = isPass ? "text-[#A8C0FF]" : "text-[#FF9DCE]";

  return (
    <mDiv
      initial={{ opacity: 0, y: 20 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ type: "spring", stiffness: 260, damping: 24, delay: index * 0.06 }}
      whileHover={{ scale: 1.02 }}
      onMouseMove={onMove}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      className="relative rounded-[24px] p-[1px]"
      style={{ background: "linear-gradient(135deg, rgba(90,31,208,0.95), rgba(243,17,180,0.75))" }}
      data-comment-anchor="verify-card"
    >
      <div
        ref={innerRef}
        className="relative overflow-hidden rounded-[23px] bg-[rgba(90,31,208,0.3)]"
        style={{ "--mx": "50%", "--my": "50%" }}
      >
        {/* 跟随光标的径向渐变光晕：pass→蓝 300px / suspicious→粉 250px，离开 300ms 淡出 */}
        <div
          className="pointer-events-none absolute inset-0 transition-opacity duration-300 ease-out"
          style={{
            opacity: hover ? 1 : 0,
            background:
              "radial-gradient(circle " + glowRadius + "px at var(--mx) var(--my), " + glowColor + ", transparent 70%)",
          }}
        ></div>

        <div className={"relative " + (compact ? "p-5 pt-11" : "p-6 pt-14")}>
          {/* 左上角状态 badge · 4px 圆角 */}
          <span
            className={"absolute left-5 top-5 rounded-[4px] border px-2.5 py-1 font-mono text-[11px] uppercase tracking-[0.12em] " + badgeCls}
          >
            {isPass ? "核验通过" : "核验存疑"}
          </span>

          <h3 className={"font-sans font-extrabold tracking-[-0.02em] " + (compact ? "text-[15px]" : "text-lg")}>
            {title}
          </h3>

          <div className="mt-3 flex items-center gap-3">
            <span className="font-mono text-[11px] uppercase tracking-[0.14em] text-[#9A93B8]">置信度</span>
            <span className={"font-mono text-sm " + numColor}>{confidence}%</span>
            <div className="h-1.5 flex-1 overflow-hidden rounded-[4px] bg-white/10">
              <div className={"h-full rounded-[4px] " + barCls} style={{ width: confidence + "%" }}></div>
            </div>
          </div>

          {evidence.length > 0 && (
            <ul className={"flex flex-col " + (compact ? "mt-2.5 gap-1.5" : "mt-4 gap-2")}>
              {evidence.map((ev, i) => (
                <li key={i} className="flex gap-2.5 text-[12.5px] leading-[1.6] text-[#C9C4DD]">
                  <span className="font-mono text-[10px] text-[#FF7AC6]">
                    {String(i + 1).padStart(2, "0")}
                  </span>
                  <span>{ev}</span>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
    </mDiv>
  );
}

window.VerifyCard = VerifyCard;

</script>
<script type="text/babel">
/* ============ 首屏：3D 场景 + 标题碎片化 + 手机屏幕锁定 ============ */
const { useState, useRef, useEffect, useMemo } = React;
const { IMG, POST } = window.DATA;

function smooth(x, a, b) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function HeroScene({ onEnter, onDirectAi, onDirectImage }) {
  const [p, setP] = useState(0);
  const prog = useRef(0);
  const target = useRef(0);

  useEffect(() => {
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const W = () => window.innerWidth;
    const onMove = (e) => { target.current = clamp01((e.clientX - W() * 0.12) / (W() * 0.72)); };
    let tSX = 0, tP = 0, dragging = false;
    const onTS = (e) => { dragging = true; tSX = e.touches[0].clientX; tP = target.current; };
    const onTM = (e) => {
      if (!dragging) return;
      target.current = clamp01(tP + (e.touches[0].clientX - tSX) / (W() * 0.72));
    };
    const onTE = () => { dragging = false; };
    let raf;
    const tick = () => {
      prog.current += (target.current - prog.current) * 0.07;
      setP(prog.current);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchstart", onTS, { passive: true });
    window.addEventListener("touchmove", onTM, { passive: true });
    window.addEventListener("touchend", onTE);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("touchstart", onTS);
      window.removeEventListener("touchmove", onTM);
      window.removeEventListener("touchend", onTE);
    };
  }, []);

  const letters = useMemo(() => {
    const words = ["TRUST", "GUARDIAN"];
    const arr = [];
    words.forEach((w) => {
      [...w].forEach((ch, ci) => arr.push({ ch, gap: ci === w.length - 1 }));
    });
    const n = arr.length;
    arr.forEach((L, i) => {
      const side = i < n / 2 ? -1 : 1;
      L.dx = side * (60 + Math.random() * 150);
      L.dy = (Math.random() - 0.4) * 170;
      L.rot = (Math.random() - 0.5) * 170;
      L.t0 = 0.1 + 0.5 * (i / n);
    });
    return arr;
  }, []);

  const letterStyle = (L) => {
    const local = Math.min(1, Math.max(0, (p - L.t0) / (0.95 - L.t0)));
    return {
      opacity: 1 - local,
      transform: "translate(" + local * L.dx + "px," + local * L.dy + "px) rotate(" + local * L.rot + "deg) scale(" + (1 - local * 0.35) + ")",
      filter: local > 0.01 ? "blur(" + local * 10 + "px)" : "none",
    };
  };

  const frontO = 1 - smooth(p, 0.12, 0.5);
  const sideO = smooth(p, 0.3, 0.68);
  const subO = 1 - smooth(p, 0.04, 0.3);
  const hintO = 1 - smooth(p, 0.35, 0.6);
  const hudO = smooth(p, 0.55, 0.8);
  const phoneO = smooth(p, 0.5, 0.8);

  return (
    <div className="hero">
      <div
        className="hero-3d"
        style={{
          transform:
            "translate(" + -p * 9 + "vw," + -p * 6 + "vh) scale(" + (1 + p * 0.55) +
            ") rotateY(" + -p * 9 + "deg) rotateX(" + p * 3 + "deg)",
        }}
      >
        <img className="hero-img" src={IMG.heroFront} alt="" style={{ opacity: frontO }}></img>
        <img className="hero-img" src={IMG.heroSide} alt="" style={{ opacity: sideO }}></img>
      </div>

      <div className="hero-fx">
        <div className="orb orb-p"></div>
        <div className="orb orb-b"></div>
      </div>
      <div className="hero-vignette"></div>

      <div className="hero-sys">TG-09 <i>ONLINE</i></div>
      <div className="hero-hud" style={{ opacity: hudO }}>TARGET LOCK · 检测目标已锁定</div>

      <div className="hero-title-wrap">
        <h1 className="hero-title display" aria-label="TRUST GUARDIAN">
          {letters.map((L, i) => (
            <span key={i} className={"ht-l" + (L.gap ? " ht-gap" : "")} style={letterStyle(L)}>{L.ch}</span>
          ))}
        </h1>
        <div className="hero-sub" style={{ opacity: subO }}>美妆种草 · 真实性核验系统</div>
      </div>

      <div className="hero-hint" style={{ opacity: hintO }}>
        <span>向右移动鼠标 · 视角靠近手机屏幕</span>
        <span className="arrow">→</span>
      </div>

      <div className="hero-feature-entries"><button type="button" className="hero-ai-entry" onClick={onDirectImage}>图片检测 <span aria-hidden="true">↗</span></button><button type="button" className="hero-ai-entry" onClick={onDirectAi}>AI 文本检测 <span aria-hidden="true">↗</span></button></div>

      {phoneO > 0.02 && (

          <span className="lock-corner lc-tl"></span>

/* ---------- 六边形雷达 ---------- */
function Radar({ k }) {
  const cx = 190, cy = 168, R = 112;
  const pt = (i, r) => {
    const a = (-90 + i * 60) * Math.PI / 180;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  const ring = (f) => RADAR.map((_, i) => pt(i, R * f).join(",")).join(" ");
  const valPts = RADAR.map((d, i) => pt(i, R * (d.value / 100) * k).join(",")).join(" ");
  return (
    <svg viewBox="0 0 380 336" className="radar" role="img" aria-label="真实性指数六边形雷达图">
      {[0.25, 0.5, 0.75, 1].map((f, i) => (
        <polygon key={i} className="radar-ring" points={ring(f)}></polygon>
      ))}
      {RADAR.map((d, i) => {
        const [x, y] = pt(i, R);
        return <line key={i} className="radar-axis" x1={cx} y1={cy} x2={x} y2={y}></line>;
      })}
      <polygon className="radar-val" points={valPts}
        style={{ fill: "var(--acc)", fillOpacity: 0.2, stroke: "var(--acc)", strokeWidth: 2 }}></polygon>
      {RADAR.map((d, i) => {
        const [x, y] = pt(i, R * (d.value / 100) * k);
        return <circle key={i} cx={x} cy={y} r="4" style={{ fill: "#fff", stroke: "var(--acc)", strokeWidth: 2 }}></circle>;
      })}
      {RADAR.map((d, i) => {
        const [x, y] = pt(i, R + 30);
        return (
          <text key={i} className="radar-lab" x={x} y={y + 4} textAnchor="middle">{d.label}</text>
        );
      })}
      {RADAR.map((d, i) => {
        const [x, y] = pt(i, R * (d.value / 100) * k);
        const [lx, ly] = pt(i, R * (d.value / 100) * k + 18);
        return <text key={i} className="radar-valnum" x={lx} y={ly + 3} textAnchor="middle">{Math.round(d.value * k)}</text>;
      })}
    </svg>
  );
}

function ScoreScreen({ onContinue, onCompat }) {
  const [k, setK] = useState(0);
  useEffect(() => {
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const x = Math.min(1, (t - t0) / 1200);
      const e = 1 - Math.pow(1 - x, 3);
      setK(e);
      if (x < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className="screen screen-enter">
      <div className="score-grid">
        <Panel title="综合评分 · 原型演示" tag="HEXAGON RADAR" className="score-radar">
          <Radar k={k} />
        </Panel>
        <Panel>
          <div className="score-label">NOTE AUTHENTICITY INDEX</div>

<script type="text/babel">
/* Isolated real-model feature. Other prototype pages continue to use demo data. */
const { useState, useEffect, useRef } = React;
const { POST } = window.DATA;
const { Btn } = window.UI;

const TEXT_SAMPLES = [
  { name: "笔记原文", text: POST.body },
  { name: "日常使用感受", text: "这瓶面霜用了快两周。我的脸颊偏干，晚上薄涂一层，第二天摸起来会软一点。鼻子周围涂多了还是有些油，所以现在只用半颗黄豆那么多。味道不算浓，不过我更喜欢没有香味的。暂时没看出别的变化，准备把这一瓶用完再决定要不要回购。" },
  { name: "种草分享文案", text: "换季护肤也能轻松拿捏！这款精华质地轻盈，一抹即融，给肌肤恰到好处的水润呵护。早上搭配防晒，晚上叠加面霜，简单两步就能开启精致护肤时刻。从日常通勤到周末约会，让每一次出门都多一点从容。正在寻找清爽保湿搭子的你，不妨了解一下。" },
];

function AiOriginPage({ onBack, onDemo }) {
  const [text, setText] = useState(POST.body);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [modelReady, setModelReady] = useState(null);
  const active = useRef(null);
  const resultRef = useRef(null);

  useEffect(() => {
    const controller = new AbortController();
    window.TextOriginAPI.health(controller.signal)
      .then((value) => setModelReady(!!value.ready))
      .catch(() => { if (!controller.signal.aborted) setModelReady(false); });
    return () => { controller.abort(); if (active.current) active.current.abort(); };
  }, []);

  function replaceText(value) {
    if (active.current) active.current.abort();
    active.current = null;
    setBusy(false);
    setText(value);
    setResult(null);
    setError("");
  }

  async function run() {
    const input = text.trim();
    if (!input) { setError("先输入一段文案。"); return; }
    if (input.length > 5000) { setError("最多输入 5000 字。"); return; }
    if (active.current) active.current.abort();
    const controller = new AbortController();
    active.current = controller;
    setBusy(true);
    setResult(null);
    setError("");
    try {
      const value = await window.TextOriginAPI.detect(input, controller.signal);
      if (active.current !== controller) return;
      setResult(value);
      setModelReady(true);
      requestAnimationFrame(() => resultRef.current && resultRef.current.focus());
    } catch (failure) {
      if (controller.signal.aborted || active.current !== controller) return;
      setError(failure.message || "检测失败，请重试。");
      setModelReady(false);
    } finally {
      if (active.current === controller) { active.current = null; setBusy(false); }
    }
  }

  const ai = result ? Math.round(result.scores.ai * 100) : 0;
  const human = result ? Math.round(result.scores.human * 100) : 0;
  const winner = result && (result.label === "ai" ? "更接近 AI 生成" : "更接近人工撰写");

  return (
    <div className="screen ai-origin screen-enter">
      <div className="ai-eyebrow"><span className="ai-eyebrow-line"></span> TEXT ORIGIN · 本地模型</div>
      <div className="ai-heading">
        <div>
          <h1>美妆文案 <em>AI 检测</em></h1>
          <p>粘贴任意种草文案，查看模型更倾向哪一类。</p>
        </div>
        <div className={"ai-service " + (modelReady === true ? "is-ready" : "") } role="status">
          <span className="ai-service-dot"></span>
          {modelReady === null ? "正在连接模型" : modelReady ? "本地模型已就绪" : "模型暂不可用"}
        </div>
      </div>

      <div className="ai-workspace">
        <section className="ai-input-pane" aria-labelledby="ai-input-title">
          <div className="ai-pane-head">
            <div><span className="ai-index">01 / INPUT</span><h2 id="ai-input-title">待检测文案</h2></div>
            <span className="ai-counter">{text.length} / 5000 字</span>
          </div>
          <textarea
            className="ai-editor"
            aria-label="待检测的美妆文案"
            placeholder="在这里输入或粘贴美妆文案…"
            maxLength={5000}
            value={text}
            onChange={(event) => replaceText(event.target.value)}
          />
          <div className="ai-sample-row" aria-label="填入示例文案">
            <span>试试示例</span>
            {TEXT_SAMPLES.map((sample) => (
              <button key={sample.name} type="button" className="ai-sample" onClick={() => replaceText(sample.text)}>{sample.name}</button>
            ))}
          </div>
          <div className="ai-input-actions">
            <button type="button" className="ai-clear" onClick={() => replaceText("")} disabled={!text}>清空</button>
            <Btn onClick={run} disabled={busy || !text.trim()}>{busy ? "模型检测中…" : result ? "重新检测 →" : "开始检测 →"}</Btn>
          </div>
          {error && <p className="ai-error" role="alert">{error}</p>}
        </section>

        <aside className="ai-output-pane" ref={resultRef} tabIndex={-1} aria-live="polite">
          <div className="ai-pane-head"><div><span className="ai-index">02 / RESULT</span><h2>检测结果</h2></div><span className="ai-local-tag">真实模型输出</span></div>
          {!result && !busy && (
            <div className="ai-empty">
              <div className="ai-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
              <strong>等待文案</strong>
              <p>检测完成后，这里会显示两类模型分值。</p>
            </div>
          )}
          {busy && <div className="ai-empty ai-loading"><div className="ai-orbit" aria-hidden="true"><span></span><span></span><span></span></div><strong>正在分析文本</strong><p>模型在本机运行，请稍候。</p></div>}
          {result && (
            <div className="ai-result-body">
              <div className="ai-verdict-label">MODEL LEANING / 模型倾向</div>
              <div className="ai-verdict">{winner}</div>
              <div className="ai-divider"></div>
              <div className="ai-bars">
                <div className="ai-score-row"><div><span>AI 生成</span><b>{ai}%</b></div><div className="ai-track"><span className="ai-fill-ai" style={{ width: ai + "%" }}></span></div></div>
                <div className="ai-score-row"><div><span>人工撰写</span><b>{human}%</b></div><div className="ai-track"><span className="ai-fill-human" style={{ width: human + "%" }}></span></div></div>
              </div>
              <p className="ai-score-note">以上是未经校准的模型分值，不能证明作者身份。</p>
              {result.truncated && <p className="ai-truncate">长文本已截断：实际分析 {result.tokensUsed} / {result.totalTokens} 个词元。</p>}
              <details className="ai-details"><summary>查看检测信息</summary><div>模型版本：{result.modelVersion}<br />用时：{result.elapsedMs} ms<br />分析词元：{result.tokensUsed} / {result.maxTokens}</div></details>
            </div>
          )}
        </aside>
      </div>
      <div className="ai-after">
        <p>只判断文本来源倾向；产品真假、功效和图片仍需另行核实。</p>
        <div><button type="button" onClick={onBack}>← 返回种草笔记</button><button type="button" onClick={onDemo}>查看其余原型演示 →</button></div>
      </div>
    </div>
  );
}

window.AiOriginPage = AiOriginPage;

</script>

  function Score({label, value, threshold, blue}) {
    return <div className={"image-score" + (blue ? " is-blue" : "")}>
      <div><b>{label}</b><strong>{pct(value)}<small>%</small></strong></div>
      <div className="image-score-track"><span style={{width: pct(value) + "%"}}/><i style={{left: pct(threshold) + "%"}} title={"判断阈值 " + pct(threshold) + "%"}/></div>
      <p>模型分值 <span>判断阈值 {pct(threshold)}%</span></p>
    </div>;
  }

  function ImageAuthenticityPage({onBack, initialSrc}) {
    const [selected, setSelected] = useState({src: initialSrc || window.DATA.IMG.effect, name: "美妆示例插画", sample: true});
    const [health, setHealth] = useState(null);
    const [busy, setBusy] = useState(false);
    const [result, setResult] = useState(null);
    const [error, setError] = useState("");
    const [notice, setNotice] = useState("");
    const [view, setView] = useState("original");
    const [opacity, setOpacity] = useState(45);
    const [zoom, setZoom] = useState(1);
    const [elapsed, setElapsed] = useState(0);
    const [drag, setDrag] = useState(false);
    const [imageError, setImageError] = useState(false);
    const request = useRef(null);
    const sequence = useRef(0);
    const objectUrl = useRef(null);
    const fileInput = useRef(null);
    const started = useRef(0);
    const resultHeading = useRef(null);
    const canvas = useRef(null);

    useEffect(() => {
      let mounted = true;
      const controller = new AbortController();
      const refresh = () => API.health(controller.signal).then(h => {if (mounted) setHealth(h);}).catch(() => {if (mounted && !controller.signal.aborted) setHealth({ready: false});});
      refresh();
      const timer = setInterval(refresh, 15000);
      return () => {mounted = false; controller.abort(); clearInterval(timer); sequence.current++; if (request.current) request.current.abort(); if (objectUrl.current) URL.revokeObjectURL(objectUrl.current);};
    }, []);

    useEffect(() => {
      if (!busy) return;
      const tick = setInterval(() => setElapsed((performance.now() - started.current) / 1000), 250);
      return () => clearInterval(tick);
    }, [busy]);

    useEffect(() => {if (canvas.current) {canvas.current.scrollLeft = 0; canvas.current.scrollTop = 0;}}, [zoom, view]);

    function stopWaiting() {
      sequence.current++;
      if (request.current) request.current.abort();
      setBusy(false);
      setNotice("已停止等待。本地计算可能仍在完成，稍后可重新检测。");
    }

    function replace(next) {
      sequence.current++;
      if (request.current) request.current.abort();
      if (objectUrl.current) {URL.revokeObjectURL(objectUrl.current); objectUrl.current = null;}
      setSelected(next); setBusy(false); setResult(null); setError(""); setNotice(""); setImageError(false); setView("original"); setZoom(1);
    }

    function chooseFile(file) {
      const validation = API.validate(file);
      if (validation) {setError(validation); return;}
      replace({file, src: "", name: file.name, sample: false});
      const url = URL.createObjectURL(file);
      objectUrl.current = url;
      setSelected({file, src: url, name: file.name, sample: false});
    }

    async function detect() {
      if (busy || (imageError && !result)) return;
      const id = ++sequence.current;
      if (request.current) request.current.abort();
      const controller = new AbortController(); request.current = controller;
      started.current = performance.now(); setElapsed(0); setBusy(true); setError(""); setNotice(""); setImageError(false); setResult(null); setView("original");
      const timeout = setTimeout(() => controller.abort(), 120000);
      try {
        const file = selected.file || await API.sample(selected.src, controller.signal);
        const validation = API.validate(file); if (validation) throw new Error(validation);
        const data = await API.detect(file, controller.signal);
        if (id !== sequence.current) return;
        setResult(data); setView("overlay"); setZoom(1); setHealth(h => ({...h, ready: true}));
        requestAnimationFrame(() => {if (resultHeading.current) resultHeading.current.focus({preventScroll: true});});
      } catch (e) {
        if (id !== sequence.current) return;
        setError(e.name === "AbortError" ? "检测等待超时，请确认本地服务正常后重试。" : e.message);
        API.health().then(setHealth).catch(() => setHealth({ready: false}));
      } finally {clearTimeout(timeout); if (id === sequence.current) setBusy(false);}
    }

    const verdict = result && VERDICTS[result.verdict];
    const original = result ? result.artifacts.original : selected.src;
    const display = result && view !== "overlay" && view !== "original" ? result.artifacts[view] : original;
    const descriptions = {
      original: "原图视图。检测不会修改上传的文件。",
      overlay: "彩色叠加显示模型响应。响应较高不等于已确认篡改。",
      heatmap: "由蓝到红表示模型响应由低到高，不是原图颜色。",
      binary_mask: "白色区域达到像素阈值 " + (result ? pct(result.thresholds.mask) : "90.0") + "%；用于定位参考。",
      ela: "重新压缩后的误差可视化。亮处也可能来自纹理或压缩，不能单独证明修改。",
    };

    return <section className="screen image-auth screen-enter">
      <div className="ai-eyebrow"><span className="ai-eyebrow-line"/>02 / IMAGE FORENSICS</div>
      <div className="image-page-heading">
        <div><h1>看清图片里的<em>线索</em></h1><p>图片生成与修改检测</p></div>
        <div className={"ai-service" + (health && health.ready ? " is-ready" : "")}><span className="ai-service-dot"/>{health === null ? "正在连接本地模型" : health.ready ? "本地模型就绪 · " + (health.device === "cuda" ? "GPU" : "CPU") : "本地服务未就绪"}</div>
      </div>

      <div className="image-workspace">
        <div className="image-task-pane">
          <div className="image-toolbar">
            <div className="image-file-name"><ImageIcon kind="image"/><span title={selected.name}>{selected.name}</span>{selected.file && <small>{bytes(selected.file.size)}</small>}</div>
            <button type="button" className="image-subtle-btn" onClick={() => fileInput.current.click()} disabled={busy}><ImageIcon kind="upload"/>更换图片</button>
            <input ref={fileInput} type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden onChange={e => {if (e.target.files[0]) chooseFile(e.target.files[0]); e.target.value = "";}}/>
          </div>
          <div className="image-view-tabs" aria-label="图片检查视图">{VIEWS.map(item => <button type="button" key={item.id} aria-pressed={view === item.id} disabled={!result && item.id !== "original"} onClick={() => {setView(item.id); setImageError(false);}}>{item.label}</button>)}</div>
          <div className={"image-canvas" + (drag ? " is-dragging" : "")} ref={canvas} tabIndex="0" aria-label="图片检查区，可滚动查看放大后的图片"
            onDragOver={e => {e.preventDefault(); if (!busy) setDrag(true);}}
            onDragLeave={e => {if (!e.currentTarget.contains(e.relatedTarget)) setDrag(false);}}
            onDrop={e => {e.preventDefault(); setDrag(false); if (!busy && e.dataTransfer.files[0]) chooseFile(e.dataTransfer.files[0]);}}>
            <div className="image-image-area" style={{width: zoom * 100 + "%", height: zoom * 100 + "%"}}>
              <img className="image-source" src={display} alt={view === "original" || view === "overlay" ? "待检测图片" : VIEWS.find(v => v.id === view).label} draggable="false" onError={() => setImageError(true)} onLoad={() => setImageError(false)}/>
              {result && view === "overlay" && <img className="image-response-layer" src={result.artifacts.heatmap} style={{opacity: opacity / 100}} alt="模型响应叠加层" draggable="false" onError={() => setImageError(true)}/>}
            </div>
            <span className="image-canvas-label">{busy ? "本地模型计算中" : selected.sample ? "示例图片" : "本机上传"}</span>
            {drag && <div className="image-drop-cover"><ImageIcon kind="upload"/><b>松开以更换图片</b></div>}
            {imageError && <div className="image-drop-cover"><b>图片无法显示</b><button type="button" className="image-subtle-btn" onClick={() => fileInput.current.click()}>重新选择图片</button></div>}
          </div>
          <div className="image-canvas-controls">
            <div className="image-zoom"><button type="button" aria-label="缩小图片" disabled={zoom <= 1} onClick={() => setZoom(z => Math.max(1, z - .25))}>−</button><button type="button" aria-label="重置图片缩放" onClick={() => setZoom(1)}>{Math.round(zoom * 100)}%</button><button type="button" aria-label="放大图片" disabled={zoom >= 3} onClick={() => setZoom(z => Math.min(3, z + .25))}>＋</button></div>
            {result && view === "overlay" ? <label className="image-opacity">叠加强度<input type="range" min="0" max="85" value={opacity} onChange={e => setOpacity(Number(e.target.value))}/><span>{opacity}%</span></label> : <span className="image-canvas-hint">{zoom > 1 ? "滚动查看局部 · 点击百分比重置" : "可拖入 JPG / PNG / WebP"}</span>}
          </div>
          <p className="image-view-description">{descriptions[view]}</p>
          <div className="image-samples"><span>换个示例</span><button type="button" disabled={busy} onClick={() => replace({src: window.DATA.IMG.effect, name: "美妆示例插画", sample: true})}>美妆插画</button><button type="button" disabled={busy} onClick={() => replace({src: "assets/images/image-check-sample.png", name: "作者提供的模型测试图", sample: true})}>模型测试图</button><small>≤ 50 MB · ≤ 2000 万像素</small></div>
        </div>

        <aside className="image-result-pane" aria-busy={busy}>
          <div className="image-rail-head"><span className="ai-index">LOCAL ANALYSIS</span><span>图片检测</span></div>
          {!result ? <div className="image-intro">
            <div className={"image-scan-emblem" + (busy ? " is-working" : "")}><ImageIcon kind="scan"/></div>
            <h2>{busy ? "正在寻找图片线索" : "一次检测，两类线索"}</h2>
            <p>{busy ? "使用本机模型处理这张图片。" : "上传原始图片，查看生成与修改的模型响应。"}</p>
            {busy ? <div className="image-wait-status" role="status"><span className="image-spinner"/>计算中 · {elapsed.toFixed(1)} 秒</div> : <div className="image-capabilities"><div><span>01</span><b>AI 生成检测</b><small>LiteGen + NPR</small></div><div><span>02</span><b>局部修改定位</b><small>IML-ViT</small></div></div>}
          </div> : <div className={"image-live-result tone-" + verdict.tone}>
            <div className="image-verdict-tag">{verdict.tag}</div>
            <h2 ref={resultHeading} tabIndex="-1">{verdict.title}</h2>
            <p className="image-explanation">{result.verdict === "likely_real" ? "当前模型未发现强异常；仍需结合原图与来源核实。" : result.verdict === "ai_generated" ? "整图生成分值达到判断阈值，建议核实图片来源。" : result.verdict === "tampered" ? "修改分值达到判断阈值，可切换热力图查看模型响应。" : "当前输出接近判断边界，建议保留原始文件进一步复核。"}</p>
            <Score label="AI 生成" value={result.scores.ai_generated} threshold={result.thresholds.ai}/>
            <Score label="图片修改" value={result.scores.tampered} threshold={result.thresholds.tamper} blue/>
            <p className="image-score-note">两项分值独立，不是图片真实或虚假的概率。</p>
            <details className="image-evidence"><summary>检测依据与文件信息<span aria-hidden="true">＋</span></summary>
              <ul>{result.evidence.map((item, i) => <li key={i}>{item}</li>)}</ul>
              <dl><div><dt>图片尺寸</dt><dd>{result.input.width} × {result.input.height}</dd></div><div><dt>实际格式</dt><dd>{result.forensics.format}</dd></div><div><dt>处理耗时</dt><dd>{result.runtime.elapsed_seconds.toFixed(2)} 秒</dd></div><div><dt>EXIF 信息</dt><dd>{Object.keys(result.forensics.exif || {}).length ? "已读取，见报告" : "未读取到；不代表伪造"}</dd></div><div><dt>C2PA 来源凭证</dt><dd>{!result.forensics.c2pa.available ? "未启用验证" : result.forensics.c2pa.manifest_present ? "发现凭证，见报告" : "未检出；不代表伪造"}</dd></div><div><dt>模型版本</dt><dd>{result.modelVersion}</dd></div></dl>
            </details>
          </div>}
          <div className="image-detect-actions">
            {error && <p className="image-error" role="alert">{error}</p>}
            {notice && <p className="image-notice" role="status">{notice}</p>}
            <button type="button" className="image-primary" onClick={detect} disabled={busy || (imageError && !result)}><ImageIcon kind="scan"/>{busy ? "正在检测…" : result ? "重新检测" : error ? "重试检测" : "开始检测"}<span aria-hidden="true">↗</span></button>
            {busy ? <button type="button" className="image-cancel" onClick={stopWaiting}>停止等待</button> : result ? <a className="image-report-download" href={result.artifacts.report} download><ImageIcon kind="download"/>下载检测报告</a> : <p className="image-local-note">在本机计算 · 图片不发送到外部服务</p>}
          </div>
        </aside>
      </div>
      <div className="image-after"><p>模型线索用于辅助复核，不作真实性证明或美妆功效判断。</p><div><button type="button" onClick={onBack}>返回种草笔记 <span aria-hidden="true">↗</span></button></div></div>
    </section>;
  }
  window.ImageAuthenticityPage = ImageAuthenticityPage;
})();

</script>
<script type="text/babel">
/* ============ 主应用：状态机 + Tweaks ============ */
const { useState, useEffect, useCallback } = React;
const { useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;
const { HeroScene, PostPage, TextVerify, ScoreScreen, Compat, AiOriginPage, ImageAuthenticityPage } = window;
const { PhaseBar } = window.UI;

function App() {
  const [t, setTweak] = useTweaks(window.TWEAK_DEFAULTS);
  const [screen, setScreen] = useState("hero");
  const [phase, setPhase] = useState(0);
  const [postKey, setPostKey] = useState(0);

  useEffect(() => {
    document.documentElement.dataset.hue = t.themeHue === "蓝主" ? "blue" : "pink";
  }, [t.themeHue]);

  useEffect(() => {
    const stage = document.querySelector(".stage");
    if (stage) stage.scrollTop = 0;
  }, [screen, postKey]);

  const stepDelay = t.scanSpeed === "快速" ? 900 : 1700;

  const onPhase = useCallback((i) => setPhase(i), []);
  const resetPost = () => {
    setPostKey((k) => k + 1);
    setScreen("post");
    setPhase(0);
  };
  const jumpTo = (i) => {
    setScreen(["post", "image", "ai", "score", "compat"][i]);
    setPhase(i);
  };

  return (
    <div className="app">
      <div className="public-demo-banner">公开演示版 · 原型页可交互 · AI 文本/图片真实检测需在本地启动模型服务</div>
      {screen !== "hero" && (
        <header className="topbar">
          <button type="button" className="logo" onClick={() => { setScreen("hero"); }} aria-label="返回首页">
            <span className="lg-dot">TG</span>
            <span>TRUST GUARDIAN</span>
          </button>
          <PhaseBar current={phase} onJump={jumpTo} />
          <div className="topbar-actions">
            <button type="button" className={"topbar-ai-link topbar-image-link" + (screen === "image" ? " is-current" : "")} onClick={() => { setScreen("image"); setPhase(1); }}>图片检测</button>
            <button type="button" className={"topbar-ai-link" + (screen === "ai" ? " is-current" : "")} onClick={() => { setScreen("ai"); setPhase(2); }}>AI 文本检测</button>
            <span className="topbar-side">美妆种草核验 DEMO</span>
          </div>
        </header>
      )}

      <main className="stage">
        {screen === "hero" && (
          <HeroScene onEnter={() => { setScreen("post"); setPhase(0); }} onDirectAi={() => { setScreen("ai"); setPhase(2); }} onDirectImage={() => { setScreen("image"); setPhase(1); }} />
        )}
        {screen === "post" && (
          <PostPage
            key={postKey}
            onPhase={onPhase}
            onTextVerify={() => { setScreen("ai"); setPhase(2); }}
            onImageVerify={() => { setScreen("image"); setPhase(1); }}
          />
        )}
        {screen === "ai" && (
          <AiOriginPage onBack={resetPost} onDemo={() => { setScreen("text"); setPhase(2); }} />
        )}
        {screen === "image" && <ImageAuthenticityPage onBack={resetPost} />}
        {screen === "text" && (
          <TextVerify onScore={() => { setScreen("score"); setPhase(3); }} stepDelay={stepDelay} />
        )}
        {screen === "score" && (
          <ScoreScreen onContinue={resetPost} onCompat={() => { setScreen("compat"); setPhase(4); }} />
        )}
        {screen === "compat" && <Compat onBackPost={resetPost} />}
      </main>

      {screen !== "hero" && (
        <footer className="foot">{screen === "image" ? "图片检测原型 · 公开演示版不连接模型 · 仅展示交互与结果结构" : screen === "ai" ? "AI 文本检测原型 · 公开演示版不连接模型 · 仅展示交互与结果结构" : "公开演示版 · 原型页使用演示数据 · 真实检测需在本地启动模型服务"}</footer>
      )}

      <TweaksPanel>
        <TweakSection label="核验节奏" />
        <TweakRadio label="扫描速度" value={t.scanSpeed} options={["标准", "快速"]} onChange={(v) => setTweak("scanSpeed", v)} />
        <TweakSection label="视觉" />
        <TweakRadio label="主题色" value={t.themeHue} options={["粉主", "蓝主"]} onChange={(v) => setTweak("themeHue", v)} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
